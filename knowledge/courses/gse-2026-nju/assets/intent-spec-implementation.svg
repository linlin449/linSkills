<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">软件是怎么从「想法」变成「代码」的</text>

  <rect x="20" y="88" width="210" height="104" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="125" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#6366f1">① 意图 intention</text>
  <text x="125" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">我想做一个东西</text>
  <text x="125" y="174" text-anchor="middle" font-size="12.5" fill="#57606a">一句话需求 / 短 README</text>

  <rect x="275" y="88" width="210" height="104" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="380" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#6366f1">② 规格 spec</text>
  <text x="380" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">它具体长什么样</text>
  <text x="380" y="174" text-anchor="middle" font-size="12.5" fill="#57606a">数据库？语言？接口？</text>

  <rect x="530" y="88" width="210" height="104" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="635" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#6366f1">③ 实现 implementation</text>
  <text x="635" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">真正的代码</text>
  <text x="635" y="174" text-anchor="middle" font-size="12.5" fill="#57606a">代码 / 测试 / 文档</text>

  <line x1="230" y1="140" x2="269" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="485" y1="140" x2="524" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="252" y="126" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="600">gap ①</text>
  <text x="507" y="126" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="600">gap ②</text>

  <rect x="20" y="300" width="720" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="324" text-anchor="middle" font-size="14" fill="#92400e">关键认知：AI 只能看到你「写下来的」部分</text>
  <text x="380" y="346" text-anchor="middle" font-size="13" fill="#92400e">没写清楚的意图，它只能靠猜——猜错就成了 slop。</text>
</svg>
