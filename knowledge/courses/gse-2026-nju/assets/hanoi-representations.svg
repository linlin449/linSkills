<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<title id="title">同一道汉诺塔，把复杂性放在不同位置</title><desc id="desc">数学规律直接决定盘号与方向；任务栈保存未完成的子任务；栈帧模拟保存调用状态与程序计数器。表示不同，适用条件与验证责任也不同。</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
</defs><rect width="760" height="430" fill="#fff"/>
<text x="380" y="34" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="700">同一道汉诺塔，把复杂性放在不同位置</text>
<rect x="20" y="75" width="230" height="300" rx="12" fill="#f8fafc" stroke="#d9dce1"/>
<text x="38" y="104" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">找到移动规律</text>
<rect x="265" y="75" width="230" height="300" rx="12" fill="#f8fafc" stroke="#d9dce1"/>
<text x="283" y="104" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">保存待办任务</text>
<rect x="510" y="75" width="230" height="300" rx="12" fill="#f8fafc" stroke="#d9dce1"/>
<text x="528" y="104" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">记住调用进度</text>
<rect x="40" y="125" width="190" height="70" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="135.0" y="152" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">三盘的移动盘号</text>
<text x="135.0" y="176" font-size="13" fill="#57606a" text-anchor="middle">1、2、1、3、1、2、1</text>
<rect x="285" y="125" width="190" height="70" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="380.0" y="152" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">先小盘，再大盘，再小盘</text>
<text x="380.0" y="176" font-size="13" fill="#57606a" text-anchor="middle">栈：最后放入的先取出</text>
<rect x="530" y="125" width="190" height="70" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="625.0" y="152" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">每次调用留一份记录</text>
<text x="625.0" y="176" font-size="13" fill="#57606a" text-anchor="middle">记参数，也记做到哪里</text>
<text x="40" y="234" font-size="13" fill="#57606a" text-anchor="start">记录每个盘在哪</text>
<text x="40" y="264" font-size="13" fill="#57606a" text-anchor="start">用规律决定下一步</text>
<text x="40" y="294" font-size="13" fill="#57606a" text-anchor="start">检查移动是否始终合法</text>
<text x="285" y="234" font-size="13" fill="#57606a" text-anchor="start">记录还没做的任务</text>
<text x="285" y="264" font-size="13" fill="#57606a" text-anchor="start">把大任务拆成小任务</text>
<text x="285" y="294" font-size="13" fill="#57606a" text-anchor="start">检查分解与执行顺序</text>
<text x="530" y="234" font-size="13" fill="#57606a" text-anchor="start">栈帧就是这份调用记录</text>
<text x="530" y="264" font-size="13" fill="#57606a" text-anchor="start">pc 表示做到哪里</text>
<text x="530" y="294" font-size="13" fill="#57606a" text-anchor="start">完成下一层，再接着做</text>
<text x="380" y="346" font-size="14" fill="#57606a" text-anchor="middle">三种写法，最少都要搬 2ⁿ − 1 次</text>
<text x="380" y="408" font-size="14" fill="#57606a" text-anchor="middle">重点不是谁代码最短，而是谁容易理解、检查和修改</text>
</svg>
