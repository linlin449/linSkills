<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">jj：具体版本有编号，持续修改的工作也有编号</text>

  <rect x="20" y="60" width="350" height="270" rx="12" fill="#f8fafc" stroke="#d9dce1"/>
  <text x="38" y="88" font-size="15" font-weight="700" fill="#1f2328">Git：选择内容，再正式提交</text>
  <rect x="55" y="104" width="280" height="40" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="195" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">① 工作区：改文件</text>
  <line x1="195" y1="144" x2="195" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="55" y="162" width="280" height="40" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="195" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">② 暂存区：git add</text>
  <line x1="195" y1="202" x2="195" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="55" y="220" width="280" height="40" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="195" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">③ commit：记录这次存档</text>
  <text x="38" y="296" font-size="12.5" fill="#dc2626">切换任务前，安排好未提交编辑</text>
  <text x="38" y="316" font-size="12.5" fill="#dc2626">可以临时收起，或使用独立目录</text>

  <rect x="390" y="60" width="350" height="270" rx="12" fill="#f8fafc" stroke="#d9dce1"/>
  <text x="408" y="88" font-size="15" font-weight="700" fill="#1f2328">jj：工作区对应可修订的提交</text>
  <rect x="425" y="104" width="280" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="565" y="129" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">编辑工作区文件</text>
  <line x1="565" y1="144" x2="565" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="425" y="162" width="280" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="565" y="187" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">多数命令先保存文件变化</text>
  <line x1="565" y1="202" x2="565" y2="216" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="425" y="220" width="280" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="565" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">版本变了，工作编号通常延续</text>
  <text x="408" y="296" font-size="12.5" fill="#57606a">不以独立暂存区作为日常中心</text>
  <text x="408" y="316" font-size="12.5" fill="#57606a">可用 Git 后端；保留操作日志</text>
</svg>
