<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">多个 AI 助手：先做后检查，还是先排队</text>

  <rect x="20" y="60" width="350" height="290" rx="12" fill="#f8fafc" stroke="#d9dce1"/>
  <text x="38" y="88" font-size="15" font-weight="700" fill="#1f2328">乐观协调：先各自做</text>
  <rect x="55" y="106" width="130" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="133" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Agent A 改文件</text>
  <rect x="215" y="106" width="130" height="44" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="280" y="133" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Agent B 改文件</text>
  <line x1="120" y1="150" x2="185" y2="202" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="280" y1="150" x2="215" y2="202" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="120" y="206" width="160" height="44" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="200" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">合并并检查结果</text>
  <text x="38" y="300" font-size="12.5" fill="#dc2626">冲突少时容易并行推进</text>
  <text x="38" y="320" font-size="12.5" fill="#dc2626">能合并，也要检查业务规则是否成立</text>

  <rect x="390" y="60" width="350" height="290" rx="12" fill="#f8fafc" stroke="#d9dce1"/>
  <text x="408" y="88" font-size="15" font-weight="700" fill="#1f2328">悲观协调：共享部分先排队</text>
  <rect x="425" y="106" width="280" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="565" y="131" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">先拿锁 → 重读最新内容</text>
  <line x1="565" y1="146" x2="565" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="425" y="164" width="280" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="565" y="189" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">改完 → commit → 释放锁</text>
  <line x1="565" y1="204" x2="565" y2="218" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="425" y="222" width="280" height="40" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="565" y="247" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">同一范围内，其他助手先等待</text>
  <text x="408" y="300" font-size="12.5" fill="#57606a">锁能减少同时覆盖，不能包办正确性</text>
  <text x="408" y="320" font-size="12.5" fill="#57606a">锁的范围、退出回收与等待顺序也要设计</text>
</svg>
