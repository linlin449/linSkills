<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">二维码：先写计算草稿，再统一翻译</text>

  <rect x="24" y="60" width="220" height="120" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="134" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">先描述算法</text>
  <text x="42" y="116" font-size="12.5" fill="#1f2328">先说清楚要怎样计算</text>
  <text x="42" y="134" font-size="12.5" fill="#1f2328">固定步骤可以提前准备</text>
  <text x="42" y="152" font-size="12.5" fill="#1f2328">文字留给使用时输入</text>

  <rect x="280" y="60" width="200" height="120" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">计算草稿（IR）</text>
  <text x="298" y="116" font-size="12" fill="#1f2328">输入、固定值、计算步骤</text>
  <text x="298" y="134" font-size="12" fill="#1f2328">查表与条件判断</text>
  <text x="298" y="152" font-size="12" fill="#1f2328">连接谁需要谁的结果</text>

  <rect x="516" y="60" width="220" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="626" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">再生成目标形式</text>
  <text x="534" y="116" font-size="12.5" fill="#1f2328">Python 程序（用于验证）</text>
  <text x="534" y="138" font-size="12.5" fill="#1f2328">Excel 公式（处理括号、</text>
  <text x="534" y="156" font-size="12.5" fill="#1f2328">单元格引用、版本兼容）</text>

  <line x1="244" y1="120" x2="278" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="480" y1="120" x2="514" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="24" y="200" width="712" height="108" rx="10" fill="#f8fafc" stroke="#d9dce1"/>
  <text x="42" y="224" font-size="13" font-weight="700" fill="#1f2328">一次需求变化，主要落到负责它的模块</text>
  <text x="42" y="248" font-size="12.5" fill="#1f2328">输入文字与单元格地址分开；换位置时，不必重新设计二维码算法；</text>
  <text x="42" y="268" font-size="12.5" fill="#1f2328">兼容性由翻译部分处理；不变内容可提前计算，不必到处手写长公式。</text>
  <text x="42" y="292" font-size="12.5" fill="#047857">检查：实际重算，并用独立扫码工具读回内容；两个后端也可能一起错。</text>
</svg>
