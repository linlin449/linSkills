<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
    </marker>
  </defs>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">后面的工作有依据，使用结果也会带来新问题</text>

  <rect x="24" y="64" width="120" height="52" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="84" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">需求</text>

  <rect x="168" y="64" width="120" height="52" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="228" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">设计</text>

  <rect x="312" y="64" width="120" height="52" rx="10" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="372" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">实现</text>

  <rect x="456" y="64" width="120" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="516" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">测试</text>

  <rect x="600" y="64" width="136" height="52" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="668" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">运行 / 维护</text>

  <line x1="144" y1="90" x2="166" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="288" y1="90" x2="310" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="432" y1="90" x2="454" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="576" y1="90" x2="598" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <text x="84" y="142" text-anchor="middle" font-size="12.5" fill="#57606a">客户想要什么</text>
  <text x="228" y="142" text-anchor="middle" font-size="12.5" fill="#57606a">根据需求安排分工</text>
  <text x="372" y="142" text-anchor="middle" font-size="12.5" fill="#57606a">按设计与要求写代码</text>
  <text x="516" y="142" text-anchor="middle" font-size="12.5" fill="#57606a">实际检查是否符合</text>
  <text x="668" y="142" text-anchor="middle" font-size="12.5" fill="#57606a">发现新情况</text>

  <path d="M 668 116 C 668 220, 84 220, 84 118" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrGreen)"/>
  <text x="380" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">使用反馈推动下一轮修改，不用一次把全部细节写完</text>

  <rect x="24" y="244" width="712" height="72" rx="10" fill="#f8fafc" stroke="#d9dce1"/>
  <text x="42" y="270" font-size="13" font-weight="700" fill="#1f2328">比较开发方法的一个问题</text>
  <text x="42" y="292" font-size="13" fill="#1f2328">什么时候能知道自己想错了？在那之前，已经投入了多少工作？</text>
</svg>
